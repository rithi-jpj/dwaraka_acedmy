<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#heroGrad)" rx="0"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="300" fill="url(#heroGrad2)" opacity="0.4"/>
  <circle cx="1100" cy="700" r="250" fill="url(#heroGrad2)" opacity="0.3"/>
  <circle cx="600" cy="400" r="400" fill="url(#heroGrad2)" opacity="0.15"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
  </g>

  <!-- Academic cap icon -->
  <g transform="translate(550, 80)">
    <rect x="0" y="30" width="100" height="10" rx="5" fill="#F59E0B" opacity="0.8"/>
    <polygon points="50,0 0,35 100,35" fill="#F59E0B" opacity="0.6"/>
    <rect x="42" y="35" width="16" height="25" rx="3" fill="#FBBF24" opacity="0.7"/>
  </g>

  <!-- Book illustration -->
  <g transform="translate(150, 150)" opacity="0.8">
    <rect x="0" y="0" width="80" height="100" rx="4" fill="#A855F7" opacity="0.3"/>
    <rect x="10" y="0" width="80" height="100" rx="4" fill="#8B5CF6" opacity="0.4"/>
    <rect x="20" y="10" width="60" height="4" rx="2" fill="#fff" opacity="0.3"/>
    <rect x="20" y="22" width="50" height="4" rx="2" fill="#fff" opacity="0.3"/>
    <rect x="20" y="34" width="55" height="4" rx="2" fill="#fff" opacity="0.3"/>
  </g>

  <!-- Building illustration -->
  <g transform="translate(300, 200)" opacity="0.6">
    <rect x="0" y="40" width="120" height="150" rx="8" fill="#fff" opacity="0.1"/>
    <rect x="15" y="55" width="25" height="30" rx="3" fill="#fff" opacity="0.15"/>
    <rect x="50" y="55" width="25" height="30" rx="3" fill="#fff" opacity="0.15"/>
    <rect x="85" y="55" width="20" height="30" rx="3" fill="#fff" opacity="0.15"/>
    <rect x="15" y="100" width="25" height="30" rx="3" fill="#fff" opacity="0.15"/>
    <rect x="50" y="100" width="25" height="30" rx="3" fill="#fff" opacity="0.15"/>
    <rect x="85" y="100" width="20" height="30" rx="3" fill="#fff" opacity="0.15"/>
    <rect x="15" y="145" width="90" height="35" rx="4" fill="#fff" opacity="0.12"/>
  </g>

  <!-- Right side decorative elements -->
  <g transform="translate(800, 500)" opacity="0.5">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="20" fill="#F59E0B" opacity="0.15"/>
  </g>

  <!-- Stars/sparkles -->
  <g fill="#F59E0B" opacity="0.6">
    <circle cx="200" cy="300" r="3"/>
    <circle cx="350" cy="150" r="2"/>
    <circle cx="850" cy="200" r="3"/>
    <circle cx="950" cy="350" r="2"/>
    <circle cx="150" cy="500" r="2"/>
    <circle cx="1050" cy="150" r="2.5"/>
    <circle cx="700" cy="100" r="2"/>
  </g>

  <!-- Bottom wave -->
  <path d="M0 700 Q300 650 600 700 T1200 700 L1200 800 L0 800Z" fill="#1E1B4B" opacity="0.3"/>
  <path d="M0 730 Q300 690 600 740 T1200 730 L1200 800 L0 800Z" fill="#1E1B4B" opacity="0.2"/>

  <!-- Central text area frame -->
  <rect x="350" y="320" width="500" height="160" rx="16" fill="#fff" opacity="0.05" stroke="#fff" stroke-width="1" stroke-opacity="0.1"/>
</svg>
