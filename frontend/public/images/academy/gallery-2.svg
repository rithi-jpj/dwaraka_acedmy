<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="gallery2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#gallery2Grad)" rx="0"/>
  <circle cx="100" cy="400" r="250" fill="#A855F7" opacity="0.08"/>
  <circle cx="700" cy="100" r="200" fill="#8B5CF6" opacity="0.06"/>
  
  <!-- Graduation cap -->
  <g transform="translate(330, 100)" opacity="0.4">
    <polygon points="70,0 0,40 140,40" fill="#F59E0B"/>
    <rect x="55" y="40" width="30" height="40" rx="4" fill="#F59E0B" opacity="0.7"/>
    <line x1="70" y1="0" x2="120" y2="-30" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Books -->
  <g transform="translate(250, 220)" opacity="0.25">
    <rect x="0" y="20" width="30" height="60" rx="3" fill="#fff"/>
    <rect x="25" y="10" width="35" height="70" rx="3" fill="#fff"/>
    <rect x="55" y="25" width="25" height="55" rx="3" fill="#fff"/>
  </g>
  
  <g fill="#F59E0B" opacity="0.3">
    <circle cx="150" cy="150" r="2.5"/>
    <circle cx="650" cy="200" r="3"/>
    <circle cx="600" cy="400" r="2"/>
    <circle cx="200" cy="350" r="2.5"/>
    <circle cx="400" cy="50" r="2"/>
  </g>
</svg>
